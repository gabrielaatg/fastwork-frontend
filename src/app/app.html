@if (!mostrarBarra()) {
  <div class="fw-aurora fw-aurora-intensa" aria-hidden="true">
    <span class="fw-aurora-a"></span>
    <span class="fw-aurora-b"></span>
    <span class="fw-aurora-c"></span>
    <span class="fw-aurora-grano"></span>
  </div>
} @else {
  <app-barra-navegacion />
}

<main class="fw-contenedor" [class.fw-contenedor-completo]="!mostrarBarra()">
  <router-outlet />
</main>
